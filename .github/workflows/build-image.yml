name: build-image

on:
    push:
        tags:
            - 'release/*'
    workflow_dispatch:

permissions:
    contents: read
    packages: write

env:
    IMAGE: ghcr.io/funkest/epgstation-fork

jobs:
    build:
        # arm64 native runner (public repoのため無料). 本番Raspberry Pi 4 (arm64) 向け
        runs-on: ubuntu-24.04-arm
        steps:
            - uses: actions/checkout@v7

            - uses: docker/setup-buildx-action@v4

            - uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # 不変条件: :debian は常に最新releaseを指す. Pi側の本番反映は :debian をpullする.
            # - release/* tag push時: :<version> (tag名からrelease/を除去したもの. 本番切り戻し用の固定tag) と :debian の両方をpush
            # - workflow_dispatch時: :sha-<短縮commit hash> のみをpushし, :debian は更新しない
            - name: Determine image tags
              id: tags
              run: |
                  if [ "${{ github.event_name }}" = "push" ]; then
                      version="${GITHUB_REF_NAME#release/}"
                      echo "tags=${IMAGE}:${version},${IMAGE}:debian" >> "$GITHUB_OUTPUT"
                  else
                      echo "tags=${IMAGE}:sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
                  fi

            - uses: docker/build-push-action@v7
              with:
                  context: .
                  file: Dockerfile.debian
                  platforms: linux/arm64
                  push: true
                  tags: ${{ steps.tags.outputs.tags }}
